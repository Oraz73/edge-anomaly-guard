# Непрерывная интеграция (CI): проверка стиля, тесты и демонстрационный прогон
# при каждом push и pull request в ветку main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Проверка стиля кода (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Тесты (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установка пакета и зависимостей
        run: pip install -e ".[dev]"
      - name: Запуск тестов с измерением покрытия
        run: pytest --cov-report=xml
      - name: Сохранение отчёта о покрытии
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  demo:
    name: Демонстрационный прогон и бенчмарк
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Генерация данных и поиск аномалий
        run: |
          mkdir -p results
          edgeguard generate -o results/sample.csv
          edgeguard detect -i results/sample.csv -m iforest -o results/detected.csv --plot results/anomalies.png
          edgeguard benchmark --json results/benchmark.json
      - name: Публикация результатов как артефакта сборки
        uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: results/
