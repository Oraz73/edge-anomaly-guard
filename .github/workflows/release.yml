# Непрерывная поставка (CD): при создании тега вида v0.1.0 пакет собирается,
# проверяется тестами и публикуется как GitHub Release с готовыми файлами.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Сборка и публикация релиза
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты перед выпуском
        run: |
          pip install -e ".[dev]"
          pytest
      - name: Сборка wheel и sdist
        run: |
          pip install build
          python -m build
      - name: Создание GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
