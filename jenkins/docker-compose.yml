# Start Jenkins:   docker compose up -d --build     (from this folder)
# Open:            http://localhost:8080   login: admin / admin123
# Stop:            docker compose down
services:
  jenkins:
    build: .
    image: edgeguard-jenkins
    container_name: edgeguard-jenkins
    # root is needed to use the host Docker socket; acceptable for a local lab server only.
    user: root
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: admin123
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
