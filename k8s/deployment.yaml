# Optional: deploy EdgeGuard to a local Kubernetes cluster (Minikube or Docker Desktop Kubernetes).
#   kubectl apply -f k8s/deployment.yaml
#   Docker Desktop: open http://localhost:30501
#   Minikube:       minikube service edgeguard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeguard
  labels:
    app: edgeguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgeguard
  template:
    metadata:
      labels:
        app: edgeguard
    spec:
      containers:
        - name: edgeguard
          image: edgeguard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: edgeguard
spec:
  type: NodePort
  selector:
    app: edgeguard
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30501
